version: "3.8"

services:
  3cx-web-interface:
    build: .
    container_name: 3cx-web-interface
    ports:
      - "3999:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Base de données PostgreSQL (rapports CDR directs)
      - PG_HOST=${PG_HOST:-localhost}
      - PG_PORT=${PG_PORT:-5432}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=${PG_DATABASE:-cdrdb}
      - PG_SSL=${PG_SSL:-false}
      # Authentification Entra ID (Microsoft Identity Platform)
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI:-http://localhost:3999/auth/callback}
      - ENTRA_SCOPES=${ENTRA_SCOPES:-User.Read}
      # Authentification locale (utilisateurs stockés en base SQLite)
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED:-false}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/app/data/cdr_users.sqlite}
      - SESSION_SECRET=${SESSION_SECRET:-changez-moi-en-production}
    restart: unless-stopped
