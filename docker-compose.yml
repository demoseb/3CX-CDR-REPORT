version: "3.8"

services:
  3cx-web-interface:
    build: .
    container_name: 3cx-web-interface
    ports:
      - "3999:3999"
    environment:
      - PORT=3999
      - NODE_ENV=production
      # Base de données PostgreSQL (rapports CDR directs)
      - PG_HOST=${PG_HOST:-localhost}
      - PG_PORT=${PG_PORT:-5432}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=${PG_DATABASE:-3cx}
      - PG_SSL=${PG_SSL:-false}
      # Authentification locale (utilisateurs stockés en base SQLite)
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED:-true}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/app/data/cdr_users.sqlite}
      - SESSION_SECRET=${SESSION_SECRET:-changez-moi-en-production-une-chaine-longue-et-aleatoire}
    volumes:
      - cdr_users_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3999/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  cdr_users_data:
